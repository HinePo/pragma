[project]
name = "pragma"
version = "0.1.0"
description = "PRAGMA financial foundation model - architecture and training-recipe reproduction"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.0.0",
    "faker>=40.38.0",
    "ipykernel>=7.3.0",
    "mlflow>=2.17.0",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "peft>=0.13.0",
    "pyarrow>=25.0.1",
    "scikit-learn>=1.5.0",
    "tokenizers>=0.22.0",
    "torch>=2.5.0",
    "transformers>=4.45.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.10.0",
    "mypy>=2.3.1",
    "nbclient>=0.11.0",
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pragma"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
packages = ["pragma"]
mypy_path = "src"
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
